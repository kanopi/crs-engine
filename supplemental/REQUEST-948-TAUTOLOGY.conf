# ------------------------------------------------------------------------
# kanopi/crs-engine — supplemental rules
# ------------------------------------------------------------------------
#
# Engine-owned rules that are NOT part of the OWASP Core Rule Set. They are
# parsed alongside CRS by bin/refresh-crs and survive CRS version bumps,
# because they live outside rules/ which the refresh regenerates.
#
# Numbered 948xxx so the file sorts between REQUEST-944 (the last CRS
# detection file) and REQUEST-949 (blocking evaluation). A scoring rule
# placed after 949 would miss the aggregation and never reach the threshold.
# The 948xxx ID block is unassigned upstream.
#
# Scope: this file exists solely to cover the paranoia-level-1 gap left by
# the two libinjection-backed rules the engine cannot run — CRS 942100
# (@detectSQLi) and 941100 (@detectXSS). It is deliberately narrow. If a
# pattern needs real tokenisation, it belongs in a libinjection port, not
# here. Do not grow this into a second rule set.
#

#
# SQL tautology — the `' OR '1'='1` / `OR 1=1` family.
#
# Upstream catches these with libinjection at PL1. Without it the most
# commonly exploited SQLi payloads pass at the default paranoia level: the
# surviving @rx rules that cover them only start at PL2, and PL2 blocks
# ordinary CMS content (markdown bodies, JSON payloads, code snippets), so
# raising the default is not an acceptable trade.
#
# Two alternatives, both chosen for a low false-positive profile:
#
#   1. Quote break-out. A quote, then optional whitespace or a closing
#      paren, then OR/AND, then a comparison. The leading quote is the
#      injection signature — prose does not put `word' OR` in a parameter.
#
#   2. Literal self-comparison with no surrounding whitespace: `1=1`, `7=7`.
#      Attack payloads are written tight; prose writes `3 = 3` with spaces.
#      That spacing is the whole discriminator, so do not "tidy" the pattern
#      by adding \s* around the operator here — it is load-bearing.
#
# Measured (tests/Integration/PayloadCorpusTest.php enforces both numbers):
#   10/10 tautology variants detected
#    0/32 false positives across realistic CMS prose, including deliberate
#         near-misses like "salary and bonus = 100", "Rock and Roll = 1955",
#         "price >= 10 and price <= 20" and "don't stop or 3 = 3 either"
#
# Known gaps, deliberately not chased with regex — they need tokenisation:
#   - comment terminators (`admin'--`) collide with quoted prose using `--`
#   - backtick RCE (`` `id` ``) collides with inline code in comment fields
#
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i)(?:['\"][\s)]*(?:or|and)\s+\(?\s*['\"]?[\w.]+['\"]?\s*(?:=|<=>|<>|!=|<|>|>=|<=)\s*\(?\s*['\"]?[\w.]+|\b(?:or|and)\s+([\w.]+)(?:=|<=>)\1\b)" \
    "id:948100,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:removeNulls,\
    msg:'SQL Injection Attack: Tautology detected',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli',\
    tag:'paranoia-level/1',\
    tag:'kanopi-crs-engine',\
    tag:'kanopi/LIBINJECTION-GAP',\
    ver:'kanopi/crs-engine',\
    severity:'CRITICAL',\
    setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
