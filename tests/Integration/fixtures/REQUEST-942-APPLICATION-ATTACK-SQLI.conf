# Test fixture: trimmed subset of OWASP CRS SQL Injection rules.
# Patterns and ids match real CRS 4.x rules so integration tests double
# as compatibility checks. Not the full file — keep small for fast tests.

SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|REQUEST_HEADERS:User-Agent "@rx (?i:\b(?:c(?:onnection_id|urrent_user)|database)\s*\()" \
    "id:942130,\
    phase:2,\
    block,\
    capture,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,\
    msg:'SQL Injection Attack: SQL Tautology Detected.',\
    tag:'attack-sqli',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|REQUEST_HEADERS:User-Agent "@rx (?i:(?:\W|^)(?:select\s+.*\s+from|union\s+.*\s+select|insert\s+into|update\s+.*\s+set|delete\s+from))" \
    "id:942260,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,t:replaceComments,\
    msg:'Detects basic SQL authentication bypass attempts 2/3',\
    tag:'attack-sqli',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|REQUEST_HEADERS:User-Agent "@rx (?i:(?:'\s*(?:o(?:r|r\s+\d|r\s+[a-z])|and\s+\d|and\s+[a-z]|x?or\s+\d)\s*[=<>]|(?:\bor\b|\band\b)\s+\d\s*[=<>])\s*\d)" \
    "id:942270,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Looking for basic sql injection. Common attack string for mysql, oracle and others.',\
    tag:'attack-sqli',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule ARGS|ARGS_NAMES "@rx (?i:\b(?:select|union|insert|update|delete|drop|alter|exec|execute)\s+)" \
    "id:942380,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:replaceComments,\
    msg:'SQL Injection Attack: keyword detected',\
    tag:'attack-sqli',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
