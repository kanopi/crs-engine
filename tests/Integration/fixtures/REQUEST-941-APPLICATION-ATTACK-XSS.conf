# Test fixture: small subset of CRS XSS rules. Reduced regexes from upstream.

SecRule ARGS|REQUEST_HEADERS|REQUEST_COOKIES "@rx (?i)<script[^>]*>" \
    "id:941110,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,\
    msg:'XSS Filter - Category 1: Script Tag Vector',\
    tag:'attack-xss',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.xss_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule ARGS|REQUEST_HEADERS|REQUEST_COOKIES "@rx (?i)\bjavascript\s*:" \
    "id:941160,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'NoScript XSS InjectionChecker: HTML Injection',\
    tag:'attack-xss',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.xss_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule ARGS|REQUEST_HEADERS|REQUEST_COOKIES "@rx (?i)on(?:abort|click|dblclick|error|focus|load|mouseover|submit)\s*=" \
    "id:941170,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'NoScript XSS InjectionChecker: Attribute Injection',\
    tag:'attack-xss',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.xss_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
