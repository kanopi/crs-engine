# Test fixture: trimmed RESPONSE-* SQL leakage rules from CRS.

SecRule RESPONSE_BODY "@rx (?i:(?:warning|error).*?(?:mysql|postgresql|oracle|sqlite|odbc).*?(?:syntax|fatal error))" \
    "id:951010,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'SQL Database Error Leakage',\
    tag:'attack-disclosure',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    setvar:'tx.outbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule RESPONSE_BODY "@rx (?i:You have an error in your SQL syntax)" \
    "id:951020,\
    phase:4,\
    block,\
    msg:'MySQL syntax error leakage',\
    tag:'attack-disclosure',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    setvar:'tx.outbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule RESPONSE_STATUS "@streq 500" \
    "id:951030,\
    phase:3,\
    pass,\
    msg:'5xx response observed',\
    tag:'observation',\
    tag:'paranoia-level/1',\
    severity:'NOTICE',\
    setvar:'tx.outbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"
