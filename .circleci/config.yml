version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

# Pipelines triggered by a scheduled trigger set `pipeline-trigger` to one of
# the names below. The default "ci" triggers on regular pushes/PRs.
parameters:
  pipeline-trigger:
    type: enum
    enum: ["ci", "weekly-refresh"]
    default: "ci"

PHP_VERSION: &PHP_VERSION "8.2"

PHP_VERSION_TEST: &PHP_VERSION_TEST
  - '8.1'
  - '8.2'
  - '8.3'
  - '8.4'
  - '8.5'

jobs:
  phpunit:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        environment:
          - PHP_VERSION=<<parameters.php>>
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.json" }}
            - composer-cache-
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - save_cache:
          key: composer-cache-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run:
          name: Run PHPUnit
          command: vendor/bin/phpunit --log-junit reports/junit.xml --testdox
      - store_test_results:
          path: reports/junit.xml
      - store_artifacts:
          path: reports

  quality-check:
    # Replaces ci-tools/composer for these checks. That job is built for deploy
    # work: it runs `sudo apt update; sudo apt install rsync` unconditionally —
    # there is no parameter to skip it — and defaults use-cache to false, so
    # every one of the fifteen check jobs on a PR paid for an apt refresh, an
    # rsync install it never used, and an uncached composer install.
    #
    # Its cache is also keyed on composer.lock, which this repo deliberately
    # does not commit (the PHP 8.1-8.5 matrix is the reason), so enabling it
    # would not have worked. Keying on composer.json, as the phpunit job
    # already does, does.
    parameters:
      php:
        type: string
        default: *PHP_VERSION
      command:
        type: string
      report:
        type: string
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.json" }}
            - composer-cache-
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - save_cache:
          key: composer-cache-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run:
          name: Run << parameters.command >>
          command: composer run-script << parameters.command >>
      - store_test_results:
          # These run even when the check fails, which is the case that matters:
          # a red build with no report attached is a build you have to re-read
          # the log for.
          path: << parameters.report >>
          when: always
      - store_artifacts:
          path: << parameters.report >>
          when: always

  coverage:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - run:
          # cimg/php ships no coverage driver at all — neither xdebug nor pcov
          # is present on disk, so PHPUnit reports "No code coverage driver
          # available" and exits non-zero. pecl auto-enables the extension it
          # installs, so docker-php-ext-enable afterwards would only produce a
          # "module already loaded" warning.
          name: Install xdebug
          command: |
            set -e
            if php -m | grep -qi '^xdebug$'; then
              echo "xdebug already present."
              exit 0
            fi
            sudo pecl install xdebug
            php -m | grep -qi '^xdebug$'
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - run:
          # Runs on one PHP version only. Coverage is a property of the tests,
          # not of the runtime, so measuring it five times would cost five times
          # as long to say the same thing.
          #
          # xdebug defaults to mode=develop, which collects nothing; the
          # test:coverage script sets XDEBUG_MODE=coverage via @putenv.
          name: Coverage floor on the detection-critical directories
          command: composer run-script test:coverage
      - store_artifacts:
          path: build/clover.xml
          destination: coverage

  refresh-and-branch:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - ci-tools/copy-ssh-key
      - ci-tools/install-github-cli
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - run:
          name: Fetch latest CRS and regenerate rules
          # Output is kept so the PR body can report the digest state rather
          # than leaving a reviewer to assume verification happened. It did not:
          # --bump re-pins by definition, so there is nothing to verify against.
          command: bin/refresh-crs --bump | tee /tmp/crs-refresh.log
      - run:
          name: Static analysis on the refreshed engine
          command: |
            composer run-script check:code
            composer run-script check:stan
            composer run-script check:rector
      - run:
          name: Run tests against the refreshed rules
          command: vendor/bin/phpunit --testdox
      - run:
          name: Push branch and open PR if anything changed
          command: |
            set -e
            # manifest.json carries a generated_at timestamp that changes
            # every refresh, so we ignore it for change detection — but
            # still include it in the commit so the manifest reflects the
            # actual run. Real rule content lives in compiled.php and the
            # per-source-file JSONs; .crs-version pins the upstream tag.
            CHANGED=$(git diff --name-only -- .crs-version rules/ | grep -v '^rules/manifest\.json$' || true)
            if [ -z "$CHANGED" ]; then
              echo "No meaningful CRS changes (only manifest timestamp). Skipping PR."
              exit 0
            fi

            echo "Changed files:"
            echo "$CHANGED" | sed 's/^/  /'

            CRS_TAG=$(grep '^tag=' .crs-version | cut -d= -f2)
            BRANCH="chore/crs-refresh-${CRS_TAG}-$(date -u +%Y%m%d)"

            git config user.email "ci@kanopi.com"
            git config user.name  "Kanopi CRS Bot"
            git checkout -b "$BRANCH"
            git add .crs-version rules/
            git commit -m "chore(crs): refresh rules to ${CRS_TAG}"
            git push -u origin "$BRANCH"

            # Build the PR body in a temp file. Avoiding inline heredoc-
            # inside-$( ) because CircleCI's parameter expansion can confuse
            # bash's heredoc parsing for that pattern.
            RULE_COUNT=$(php -r 'echo count((require "rules/compiled.php")["rules"]);')
            FILE_COUNT=$(ls rules/REQUEST-*.json rules/RESPONSE-*.json 2>/dev/null | wc -l | tr -d ' ')
            WARNINGS=$(php -r '$m=json_decode(file_get_contents("rules/manifest.json"),true); echo count($m["warnings"] ?? []);')

            DIGEST_LINE=$(grep -i 'Content digest' /tmp/crs-refresh.log || true)

            PR_BODY=/tmp/crs-pr-body.md
            {
              echo "Automated CRS rule refresh."
              echo ""
              echo "- Upstream tag: \`${CRS_TAG}\`"
              echo "- Rules parsed: ${RULE_COUNT} across ${FILE_COUNT} files"
              echo "- Parser warnings: ${WARNINGS} — read them, do not just count them."
              echo "  Four are the expected libinjection rules. The rest name rules whose"
              echo "  actions this engine ignores, so a jump here means upstream changed"
              echo "  something the engine does not implement."
              echo "- Static analysis (phpcs / phpstan / rector): passed"
              echo "- Engine tests (phpunit): passed against the refreshed ruleset"
              echo ""
              echo "### Content digest: recorded, NOT verified"
              echo ""
              if [ -n "$DIGEST_LINE" ]; then
                echo "\`\`\`"
                echo "$DIGEST_LINE"
                echo "\`\`\`"
                echo ""
              fi
              echo "This job runs \`--bump\`, which re-pins by definition — moving to a new"
              echo "tag *is* a content change, so there is nothing to verify the download"
              echo "against. The digest is trust-on-first-use on every run, and it is not a"
              echo "signature: it does not authenticate the publisher."
              echo ""
              echo "**The \`rules/\` diff below is the only real review gate.** Read it for"
              echo "regex changes that could shift detection behaviour, and for anything that"
              echo "does not look like it came from CRS."
              echo ""
              echo "Generated by the \`weekly-refresh\` CircleCI workflow."
            } > "$PR_BODY"

            gh pr create \
              --title "chore(crs): refresh rules to ${CRS_TAG}" \
              --body-file "$PR_BODY" \
              --label crs-bump

workflows:
  test:
    when:
      equal: [ ci, << pipeline.parameters.pipeline-trigger >> ]
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - coverage:
          name: 'coverage'
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - quality-check:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpstan <<matrix.php>>'
          context: kanopi-code
          command: 'check:stan:circleci'
          report: phpstan-report.xml
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - quality-check:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'rector <<matrix.php>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          report: rector-report.xml
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - quality-check:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'quality <<matrix.php>>'
          context: kanopi-code
          command: 'check:code:circleci'
          report: phpcs-report.xml
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/

  weekly-refresh:
    # Trigger this workflow from a CircleCI Scheduled Pipeline:
    #   Schedule: 0 6 * * 1
    #   Parameter: pipeline-trigger = weekly-refresh
    when:
      equal: [ weekly-refresh, << pipeline.parameters.pipeline-trigger >> ]
    jobs:
      - refresh-and-branch:
          context: kanopi-code

  release:
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit-release <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - quality-check:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpstan-release <<matrix.php>>'
          context: kanopi-code
          command: 'check:stan:circleci'
          report: phpstan-report.xml
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - quality-check:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'rector-release <<matrix.php>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          report: rector-report.xml
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - quality-check:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'quality-release <<matrix.php>>'
          context: kanopi-code
          command: 'check:code:circleci'
          report: phpcs-report.xml
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
