version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

# Pipelines triggered by a scheduled trigger set `pipeline-trigger` to one of
# the names below. The default "ci" triggers on regular pushes/PRs.
parameters:
  pipeline-trigger:
    type: enum
    enum: ["ci", "weekly-refresh"]
    default: "ci"

PHP_VERSION: &PHP_VERSION "8.2"

PHP_VERSION_TEST: &PHP_VERSION_TEST
  - '8.1'
  - '8.2'
  - '8.3'
  - '8.4'
  - '8.5'

jobs:
  phpunit:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        environment:
          - PHP_VERSION=<<parameters.php>>
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.json" }}
            - composer-cache-
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - save_cache:
          key: composer-cache-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run:
          name: Run PHPUnit
          command: vendor/bin/phpunit --log-junit reports/junit.xml --testdox
      - store_test_results:
          path: reports/junit.xml
      - store_artifacts:
          path: reports

  refresh-and-branch:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - ci-tools/copy-ssh-key
      - ci-tools/install-github-cli
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - run:
          name: Fetch latest CRS and regenerate rules
          # Output is kept so the PR body can report the digest state rather
          # than leaving a reviewer to assume verification happened. It did not:
          # --bump re-pins by definition, so there is nothing to verify against.
          command: bin/refresh-crs --bump | tee /tmp/crs-refresh.log
      - run:
          name: Static analysis on the refreshed engine
          command: |
            composer run-script check:code
            composer run-script check:stan
            composer run-script check:rector
      - run:
          name: Run tests against the refreshed rules
          command: vendor/bin/phpunit --testdox
      - run:
          name: Push branch and open PR if anything changed
          command: |
            set -e
            # manifest.json carries a generated_at timestamp that changes
            # every refresh, so we ignore it for change detection — but
            # still include it in the commit so the manifest reflects the
            # actual run. Real rule content lives in compiled.php and the
            # per-source-file JSONs; .crs-version pins the upstream tag.
            CHANGED=$(git diff --name-only -- .crs-version rules/ | grep -v '^rules/manifest\.json$' || true)
            if [ -z "$CHANGED" ]; then
              echo "No meaningful CRS changes (only manifest timestamp). Skipping PR."
              exit 0
            fi

            echo "Changed files:"
            echo "$CHANGED" | sed 's/^/  /'

            CRS_TAG=$(grep '^tag=' .crs-version | cut -d= -f2)
            BRANCH="chore/crs-refresh-${CRS_TAG}-$(date -u +%Y%m%d)"

            git config user.email "ci@kanopi.com"
            git config user.name  "Kanopi CRS Bot"
            git checkout -b "$BRANCH"
            git add .crs-version rules/
            git commit -m "chore(crs): refresh rules to ${CRS_TAG}"
            git push -u origin "$BRANCH"

            # Build the PR body in a temp file. Avoiding inline heredoc-
            # inside-$( ) because CircleCI's parameter expansion can confuse
            # bash's heredoc parsing for that pattern.
            RULE_COUNT=$(php -r 'echo count((require "rules/compiled.php")["rules"]);')
            FILE_COUNT=$(ls rules/REQUEST-*.json rules/RESPONSE-*.json 2>/dev/null | wc -l | tr -d ' ')
            WARNINGS=$(php -r '$m=json_decode(file_get_contents("rules/manifest.json"),true); echo count($m["warnings"] ?? []);')

            DIGEST_LINE=$(grep -i 'Content digest' /tmp/crs-refresh.log || true)

            PR_BODY=/tmp/crs-pr-body.md
            {
              echo "Automated CRS rule refresh."
              echo ""
              echo "- Upstream tag: \`${CRS_TAG}\`"
              echo "- Rules parsed: ${RULE_COUNT} across ${FILE_COUNT} files"
              echo "- Parser warnings: ${WARNINGS} (libinjection rules expected)"
              echo "- Static analysis (phpcs / phpstan / rector): passed"
              echo "- Engine tests (phpunit): passed against the refreshed ruleset"
              echo ""
              echo "### Content digest: recorded, NOT verified"
              echo ""
              if [ -n "$DIGEST_LINE" ]; then
                echo "\`\`\`"
                echo "$DIGEST_LINE"
                echo "\`\`\`"
                echo ""
              fi
              echo "This job runs \`--bump\`, which re-pins by definition — moving to a new"
              echo "tag *is* a content change, so there is nothing to verify the download"
              echo "against. The digest is trust-on-first-use on every run, and it is not a"
              echo "signature: it does not authenticate the publisher."
              echo ""
              echo "**The \`rules/\` diff below is the only real review gate.** Read it for"
              echo "regex changes that could shift detection behaviour, and for anything that"
              echo "does not look like it came from CRS."
              echo ""
              echo "Generated by the \`weekly-refresh\` CircleCI workflow."
            } > "$PR_BODY"

            gh pr create \
              --title "chore(crs): refresh rules to ${CRS_TAG}" \
              --body-file "$PR_BODY" \
              --label crs-bump

workflows:
  test:
    when:
      equal: [ ci, << pipeline.parameters.pipeline-trigger >> ]
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'phpstan <<matrix.tag>>'
          context: kanopi-code
          command: 'check:stan:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpstan-report.xml
            - store_artifacts:
                path: phpstan-report.xml
                destination: phpstan
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'rector <<matrix.tag>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: rector-report.xml
            - store_artifacts:
                path: rector-report.xml
                destination: rector
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'quality <<matrix.tag>>'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpcs-report.xml
            - store_artifacts:
                path: phpcs-report.xml
                destination: phpcs

  weekly-refresh:
    # Trigger this workflow from a CircleCI Scheduled Pipeline:
    #   Schedule: 0 6 * * 1
    #   Parameter: pipeline-trigger = weekly-refresh
    when:
      equal: [ weekly-refresh, << pipeline.parameters.pipeline-trigger >> ]
    jobs:
      - refresh-and-branch:
          context: kanopi-code

  release:
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit-release <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'phpstan-release <<matrix.tag>>'
          context: kanopi-code
          command: 'check:stan:circleci'
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'rector-release <<matrix.tag>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'quality-release <<matrix.tag>>'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
