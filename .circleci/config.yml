version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

# Pipelines triggered by a scheduled trigger set `pipeline-trigger` to one of
# the names below. The default "ci" triggers on regular pushes/PRs.
parameters:
  pipeline-trigger:
    type: enum
    enum: ["ci", "weekly-refresh"]
    default: "ci"

PHP_VERSION: &PHP_VERSION "8.2"

PHP_VERSION_TEST: &PHP_VERSION_TEST
  - '8.1'
  - '8.2'
  - '8.3'
  - '8.4'
  - '8.5'

jobs:
  phpunit:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
        environment:
          - PHP_VERSION=<<parameters.php>>
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.json" }}
            - composer-cache-
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - save_cache:
          key: composer-cache-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run:
          name: Run PHPUnit
          command: vendor/bin/phpunit --log-junit reports/junit.xml --testdox
      - store_test_results:
          path: reports/junit.xml
      - store_artifacts:
          path: reports

  refresh-and-branch:
    parameters:
      php:
        type: string
        default: *PHP_VERSION
    docker:
      - image: cimg/php:<< parameters.php >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    resource_class: small
    steps:
      - checkout
      - ci-tools/copy-ssh-key
      - ci-tools/install-github-cli
      - run:
          name: Install dependencies
          command: composer install --optimize-autoloader --no-progress --no-interaction
      - run:
          name: Fetch latest CRS and regenerate rules
          command: bin/refresh-crs --bump
      - run:
          name: Static analysis on the refreshed engine
          command: |
            composer run-script check:code
            composer run-script check:stan
            composer run-script check:rector
      - run:
          name: Run tests against the refreshed rules
          command: vendor/bin/phpunit --testdox
      - run:
          name: Push branch and open PR if anything changed
          command: |
            set -e
            if git diff --quiet -- .crs-version rules/; then
              echo "No CRS rule changes — nothing to do."
              exit 0
            fi

            CRS_TAG=$(grep '^tag=' .crs-version | cut -d= -f2)
            BRANCH="chore/crs-refresh-${CRS_TAG}-$(date -u +%Y%m%d)"

            git config user.email "ci@kanopi.com"
            git config user.name  "Kanopi CRS Bot"
            git checkout -b "$BRANCH"
            git add .crs-version rules/
            git commit -m "chore(crs): refresh rules to ${CRS_TAG}"
            git push -u origin "$BRANCH"

            # Count parsed rules so the PR body has a quick stat at a glance.
            RULE_COUNT=$(php -r 'echo (require "rules/compiled.php")["rules"] ? count((require "rules/compiled.php")["rules"]) : 0;')
            FILE_COUNT=$(ls rules/REQUEST-*.json rules/RESPONSE-*.json 2>/dev/null | wc -l | tr -d ' ')
            WARNINGS=$(php -r '$m=json_decode(file_get_contents("rules/manifest.json"),true); echo count($m["warnings"] ?? []);')

            gh pr create \
              --title "chore(crs): refresh rules to ${CRS_TAG}" \
              --body "$(cat <<EOF
            Automated CRS rule refresh.

            - Upstream tag: \`${CRS_TAG}\`
            - Rules parsed: ${RULE_COUNT} across ${FILE_COUNT} files
            - Parser warnings: ${WARNINGS} (libinjection rules expected)
            - Static analysis (phpcs / phpstan / rector): passed
            - Engine tests (phpunit): passed against the refreshed ruleset

            Review the diff in \`rules/\` to spot any regex changes that
            could shift detection behavior, then merge.

            Generated by the \`weekly-refresh\` CircleCI workflow.
            EOF
            )" \
              --label crs-bump

workflows:
  test:
    when:
      equal: [ ci, << pipeline.parameters.pipeline-trigger >> ]
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'phpstan <<matrix.tag>>'
          context: kanopi-code
          command: 'check:stan:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpstan-report.xml
            - store_artifacts:
                path: phpstan-report.xml
                destination: phpstan
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'rector <<matrix.tag>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: rector-report.xml
            - store_artifacts:
                path: rector-report.xml
                destination: rector
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'quality <<matrix.tag>>'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /.*/
          post-steps:
            - store_test_results:
                path: phpcs-report.xml
            - store_artifacts:
                path: phpcs-report.xml
                destination: phpcs

  weekly-refresh:
    # Trigger this workflow from a CircleCI Scheduled Pipeline:
    #   Schedule: 0 6 * * 1
    #   Parameter: pipeline-trigger = weekly-refresh
    when:
      equal: [ weekly-refresh, << pipeline.parameters.pipeline-trigger >> ]
    jobs:
      - refresh-and-branch:
          context: kanopi-code

  release:
    jobs:
      - phpunit:
          matrix:
            parameters:
              php: *PHP_VERSION_TEST
          name: 'phpunit-release <<matrix.php>>'
          context: kanopi-code
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'phpstan-release <<matrix.tag>>'
          context: kanopi-code
          command: 'check:stan:circleci'
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'rector-release <<matrix.tag>>'
          context: kanopi-code
          command: 'check:rector:circleci'
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - ci-tools/composer:
          matrix:
            parameters:
              tag: *PHP_VERSION_TEST
          name: 'quality-release <<matrix.tag>>'
          context: kanopi-code
          command: 'check:code:circleci'
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
